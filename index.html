<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FantaManiac</title>
<meta name="theme-color" content="#082414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FantaManiac">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AA%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#137a3c; --felt-2:#1b9a4f; --felt-3:#082414;
  --chalk:#eaf1ec; --chalk-dim:#a9c0b3;
  --chip:#8fe04f; --chip-ink:#06210f; --card:#0f3820; --teal-d:#1a6b38; --red-1:#7d0000; --red-2:#ff1010;
  --red:#e05a4f; --line:rgba(234,241,236,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{zoom:.86}
body{margin:0;background:repeating-linear-gradient(90deg,#082414 0 64px,#0a2b18 64px 128px);color:var(--chalk);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:calc(100vh/.86);padding:0 16px 110px}
h1,h2,h3,.disp{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:40px;line-height:1}
h2{font-size:26px}
p{margin:0}
.dim{color:var(--chalk-dim)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--chip);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;font-weight:600;font-size:16px;background:var(--chip);color:var(--chip-ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--chalk)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.wide{width:100%}

/* lobby */
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.tag{font-size:13px;color:var(--chalk-dim)}
.table-card{margin-top:14px;border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(160deg,var(--felt-2),var(--felt));padding:16px}
.table-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.seats-dots{display:flex;gap:6px;margin-top:10px}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--chalk-dim)}
.dot.on{background:var(--chip);border-color:var(--chip)}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0}
.fact b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1}
.fact span{font-size:12px;color:var(--chalk-dim)}
.rules-toggle{color:var(--chalk-dim);font-size:14px;text-decoration:underline;padding:6px 0}
.rules{margin:6px 0 12px;padding-left:18px;color:var(--chalk-dim);font-size:14px}
.rules li{margin:3px 0}


/* lobby stile PokerStars */
.lob-head{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 10px}
.online{font-size:13px;color:var(--chalk-dim);display:flex;align-items:center;gap:6px}
.online::before{content:"";width:8px;height:8px;border-radius:50%;background:#5fd38a}
.filters{display:grid;gap:8px;margin-bottom:12px}
.frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.frow .lbl{font-size:13px;color:var(--chalk-dim);min-width:52px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--chalk);color:var(--felt-3);border-color:var(--chalk)}
.ttable{border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:#0c2f1a}
.trow{display:grid;grid-template-columns:1fr 64px 48px;align-items:center;gap:6px;width:100%;text-align:left;padding:0 12px;min-height:54px;border-top:1px solid var(--line)}
.trow.h{min-height:42px;background:#082414;border-top:0;font-size:12px;color:var(--chalk-dim);font-weight:600}
.trow.h button{text-align:inherit;font-size:12px;font-weight:600;color:var(--chalk-dim);min-height:42px}
.trow.h button.on{color:var(--chip)}
.trow .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.trow .nm span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .num{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-align:right}
.st{width:10px;height:10px;border-radius:50%;flex:none;background:#5fd38a}
.st.hot{background:var(--chip)}
.st.run{background:#6b7f74}
.trow.data:active{background:rgba(255,255,255,.06)}
.trow.sel{background:rgba(20,201,162,.12)}
.trow.run{opacity:.5}
.tdetail{padding:12px 14px 14px;background:rgba(0,0,0,.18);border-top:1px solid var(--line)}
.tdetail .facts{margin:0 0 8px}
.empty-l{padding:24px;text-align:center;color:var(--chalk-dim)}


/* home */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.hdr .l{display:flex;align-items:center;gap:10px}
.hdr .name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-style:italic;font-size:27px;letter-spacing:.02em}
.hdr .name b,.wm b{color:var(--chip);font-weight:700}
.login{min-height:44px;padding:0 26px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-weight:700;font-size:18px}
.burger{width:44px;height:44px;display:grid;place-items:center}
.hero{margin:0 -16px;position:relative;display:grid;grid-template-columns:42% 1fr;align-items:center;min-height:200px;background:linear-gradient(100deg,#2b1a05 0%,#3a1305 38%,var(--red-1) 40%,var(--red-2) 100%);overflow:hidden}
.hero .art{display:grid;place-items:center;padding:10px}
.hero .txt{padding:14px 16px 14px 8px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:27px;line-height:1.05;text-transform:uppercase;letter-spacing:.005em}
.chips{display:flex;gap:8px;overflow-x:auto;margin:2px -16px 0;padding:0 16px 10px;border-bottom:1px solid #1d4a2c;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.mchip{flex:none;scroll-snap-align:start;height:42px;padding:0 14px;border-radius:999px;background:var(--card);border:2px solid transparent;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:500;white-space:nowrap}
.mchip svg{width:19px;height:19px}
.mchip.on{background:var(--teal-d);border-color:var(--chip);font-weight:700}
.strip{margin-top:16px;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:repeating-conic-gradient(from 0deg at 22% 50%,#1f9c4c 0 7deg,#157a38 7deg 14deg)}
.strip .ic{width:54px;height:54px;flex:none}
.strip .t{flex:1;min-width:0}
.strip b{display:block;font-size:20px;line-height:1.15}
.strip span{font-size:14px;opacity:.9}
.strip .btn{background:transparent;border:2px solid #fff;color:#fff;min-height:46px}
.sec{font-size:28px;font-weight:700;margin:26px 0 12px;font-family:'Barlow',system-ui,sans-serif}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{text-align:left;border-radius:20px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;min-height:196px}
.mcard .top{height:88px;display:grid;place-items:center}
.mcard .top svg{width:46px;height:46px}
.mcard .bd{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.mcard b{font-size:18px}
.mcard .ds{font-size:13px;color:var(--chalk-dim);line-height:1.3;flex:1}
.pill{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--teal-d);color:var(--chip)}
.pill.soon{background:#1f4a30;color:var(--chalk-dim)}
.g1{background:linear-gradient(135deg,#2a5bd7,#7a2fd0)}
.g2{background:linear-gradient(135deg,#0a8f74,#0b4f7a)}
.g3{background:linear-gradient(135deg,#e07a10,#c02a2a)}
.g4{background:linear-gradient(135deg,#b0299a,#4a2a9a)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#061c0f;border-top:1px solid #1d4a2c;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:var(--chalk);position:relative}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--chip);font-weight:700}
#nav button.on::before{content:"";position:absolute;top:0;left:14%;right:14%;height:3px;border-radius:0 0 3px 3px;background:var(--chip)}
#toast{position:fixed;left:16px;right:16px;bottom:88px;z-index:30;max-width:448px;margin:0 auto;background:#154a29;border:1px solid #2f6a43;border-radius:14px;padding:12px 16px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-10px}
.soon-box{margin-top:24px;border-radius:20px;background:var(--card);padding:20px}


.mcard .top{position:relative}
.newb{position:absolute;top:8px;left:8px;background:#fff;color:#000;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px}
.mcard.feat{grid-column:1/-1;flex-direction:row;min-height:0}
.mcard.feat .top{width:34%;height:auto;min-height:120px}
.g5{background:linear-gradient(135deg,#f5b400,#e0561a)}
.weekbox{margin:14px 0 6px;border-radius:16px;padding:12px 14px;background:linear-gradient(120deg,#1a5a30,#0f3d22);font-size:14px;line-height:1.4}
.weekbox b{display:block;font-size:16px;margin-bottom:2px}

.avbtn{width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--chip-ink);font-weight:800;font-size:20px;font-family:'Barlow Condensed',sans-serif}
.g6{background:linear-gradient(135deg,#e0264a,#7a1fd0)}
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.sh-card{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#0d301b;border-top-left-radius:24px;border-top-right-radius:24px;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid #1d4a2c}
.inp{width:100%;min-height:52px;border-radius:14px;border:1.5px solid #2f6a43;background:#061c0f;color:var(--chalk);font:inherit;font-size:17px;padding:0 14px}
.inp:focus{outline:2px solid var(--chip);outline-offset:1px}
.menu{display:grid;gap:8px;margin-top:12px}
.menu button{min-height:54px;border-radius:14px;background:#154a29;text-align:left;padding:0 16px;font-weight:600;font-size:17px;display:flex;align-items:center;gap:12px}
.menu button svg{width:24px;height:24px;color:var(--chip)}
.page-t{padding-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{background:var(--card);border-radius:16px;padding:14px}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:34px;line-height:1;color:var(--chip)}
.stat span{font-size:13px;color:var(--chalk-dim)}
.bigav{width:76px;height:76px;border-radius:50%;background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px}
.prof-h{display:flex;align-items:center;gap:16px;margin-top:8px}
.empty-state{margin-top:24px;border-radius:20px;background:var(--card);padding:26px 20px;text-align:center}
.empty-state svg{width:44px;height:44px;color:var(--chalk-dim)}
.empty-state h2{margin:10px 0 6px}
.hcard{background:var(--card);border-radius:18px;padding:14px;margin-top:12px}
.hcard summary{cursor:pointer;list-style:none}
.hcard summary::-webkit-details-marker{display:none}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hrow b{font-size:18px}
.hsub{font-size:13px;color:var(--chalk-dim);margin-top:2px}
.step{display:flex;gap:14px;margin-top:14px}
.step i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--teal-d);border:2px solid var(--chip);display:grid;place-items:center;font-style:normal;font-weight:700}
.gloss{margin-top:10px;padding:12px 14px;background:var(--card);border-radius:14px}
.gloss b{display:block;margin-bottom:2px}
.gloss span{font-size:14px;color:var(--chalk-dim)}
.trow .nm small{display:block;font-size:12px;font-weight:400;color:var(--chalk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .nm .tt{min-width:0}

.tb{display:flex;align-items:center;gap:4px;padding:14px 0 12px}
.tb .back{margin-left:-10px}
.tb-t{flex:1;font-family:'Barlow',system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1.1}
.vcard{display:flex;width:100%;text-align:left;border:1.5px solid #2f6a43;border-radius:22px;overflow:hidden;background:#0a2a17;margin-bottom:14px;min-height:150px}
.vcard:active{background:#0d301b}
.vart{width:36%;flex:none;position:relative;display:flex;align-items:center;padding:0 12px;overflow:hidden}
.vart svg{position:absolute;right:-14px;bottom:-14px;width:92px;height:92px;opacity:.22;color:#fff}
.vname{position:relative;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:33px;line-height:.95;color:#fff;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.vbody{flex:1;min-width:0;padding:10px 12px 12px;display:flex;flex-direction:column}
.vtags{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tg{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
.tg.p{background:#7a0fa8;color:#fff}.tg.t{background:#0b7f97;color:#fff}.tg.s{background:#1f4a30;color:#9fc7ad}
.vtitle{font-size:21px;margin:auto 0;padding:8px 0}
.vf{display:flex;gap:18px}
.vf small{display:block;color:var(--chalk-dim);font-size:15px}
.vf b{font-size:18px;font-weight:600}
.oval-wrap.dense{height:min(96vw,420px)}
.dense .oseat{width:54px}
.dense .oseat .av{width:32px;height:32px;font-size:16px;border-width:1.5px}
.dense .oseat .nm{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dense .oseat .cr{font-size:10px}
.dense .ocenter{width:46%}
.dense .ocenter .price{font-size:50px}
.dense .ocenter .pname{font-size:21px}

.dhead{display:flex;align-items:center;gap:6px;padding:10px 0}
.dhead .burger{margin-left:-8px}
.dhead .ttl{flex:1;min-width:0}
.dhead .ttl b{display:block;font-size:22px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;display:grid;place-items:center}
.ibtn svg{width:26px;height:26px}
.lsel{width:100%;min-height:56px;border-radius:18px;background:#061c0f;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:19px;margin-top:6px}
.stage{position:relative;margin:14px -16px 0;padding:18px 0 0;text-align:center;overflow:hidden;background:radial-gradient(130% 80% at 50% 100%,#2bb35c 0%,#12793b 48%,#0b4a25 100%);border-bottom:6px solid #0a3d20}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 46px,transparent 46px 92px)}
.stage>*{position:relative}
.tname{font-size:30px;font-weight:600;line-height:1.1;padding:0 76px}
.jersey{width:210px;height:210px;margin:8px auto 0;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.sbtns{position:absolute!important;right:16px;top:14px;display:grid;gap:12px}
.sbtns button{width:48px;height:48px;border-radius:50%;background:#fff;color:#12793b;display:grid;place-items:center}
.sbtns svg{width:26px;height:26px}
.wm{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-style:italic;font-size:38px;letter-spacing:.03em;padding:4px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:#061c0f;border-radius:22px;padding:14px 0;margin-top:14px}
.kpis div{text-align:center;border-left:1px solid rgba(255,255,255,.14)}
.kpis div:first-child{border-left:0}
.kpis b{display:block;font-size:32px;font-weight:500;line-height:1.1}
.kpis span{font-size:15px;color:var(--chalk-dim)}
.news{width:100%;margin-top:14px;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 14px;border-radius:20px;background:#061c0f;text-align:left}
.news .rt{background:#e23b3b;color:#fff;font-weight:700;border-radius:999px;padding:6px 16px;font-size:17px;flex:none}
.news .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:500}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.sec-row h2{font-size:26px;font-weight:600;font-family:'Barlow',system-ui,sans-serif}
.match{border-radius:22px;padding:18px 10px 16px;background:linear-gradient(180deg,#22a552,#0f6b30);display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;text-align:center}
.crests{display:flex;justify-content:center}
.crest{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;border:2px solid rgba(255,255,255,.35);color:#fff}
.crests .crest+.crest{margin-left:-14px}
.mteam{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.mteam b{font-size:16px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mscore{background:rgba(255,255,255,.22);padding:6px 20px;border-radius:999px;font-size:32px;font-weight:500;margin-top:4px}
.pts{font-size:19px;margin-top:8px;display:flex;gap:16px;justify-content:center}
.lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 14px;border-radius:16px;background:#0f3820;text-align:left;margin-top:8px;font-size:17px}
.lrow.on{border:2px solid var(--chip)}
.lrow small{display:block;font-size:13px;color:var(--chalk-dim)}

.codecard{display:flex;gap:10px;margin-top:14px}
.codecard .inp{flex:1;text-transform:uppercase;letter-spacing:.2em;text-align:center;font-weight:700}
.codebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--card)}
.codebox .code{font-family:'Barlow Condensed',sans-serif;font-size:40px;letter-spacing:.18em;color:var(--chip);line-height:1}
.codebox .btn{margin-left:auto}
.tm{display:block;font-size:12px;font-weight:400;color:var(--chalk-dim)}
.rrow .tm{display:inline;margin-left:6px}
/* waiting */
.wait-seats{display:grid;gap:10px;margin:18px 0}
.wseat{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px;min-height:56px}
.wseat.in{border-style:solid;background:rgba(255,255,255,.05)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:18px;flex:none}
.avatar.me{background:var(--chalk)}
.big-count{font-family:'Barlow Condensed',sans-serif;font-size:72px;line-height:1;text-align:center;color:var(--chip)}

/* auction */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:14px}
.seatgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.seat{border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;background:rgba(255,255,255,.03);min-width:0}

.tbar.low i{background:var(--red)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

.msg{font-size:14px;color:var(--chalk-dim);margin-top:6px;min-height:20px}

.plist{display:grid;gap:8px;max-height:46vh;overflow-y:auto}
.prow{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);text-align:left;width:100%}

details.roster{margin-top:14px;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px}

/* tavolo ovale */
.oval-wrap{position:relative;height:min(84vw,360px);margin:6px 0 4px}

.quick{margin-bottom:12px}
.panel{border-radius:20px;border:1.5px solid var(--line);background:rgba(255,255,255,.03);padding:14px}

/* results */
.res{margin-top:14px;border:1.5px solid var(--line);border-radius:18px;padding:14px;background:rgba(255,255,255,.03)}

.note{margin-top:18px;font-size:13px;color:var(--chalk-dim);border-top:1px solid var(--line);padding-top:12px}

.cwrap{max-height:78vh;overflow:auto;padding-bottom:6px}

<script>
const ROLE_NAME = {P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
const slotOf = (n,role)=>!n?null:('F' in n)?((role==='P'&&n.P>0)?'P':(n.F>0?'F':null)):(n[role]>0?role:null);

const $app = document.getElementById('app');

const rnd = (a,b)=>a+Math.random()*(b-a);
const ri = (a,b)=>Math.floor(rnd(a,b+1));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};


/* ---------- DATI SALVATI (solo su questo dispositivo) ---------- */

function saveStore(){ try{ localStorage.setItem('fanta_tavolo_v1',JSON.stringify(STORE)); }catch(e){} }
function openSheet(html){
  const el=document.getElementById('sheet');
  el.innerHTML=`<div class="sh-bg" data-close></div><div class="sh-card" role="dialog" aria-modal="true">${html}</div>`;
  el.hidden=false; el.querySelector('[data-close]').onclick=closeSheet;
}
function closeSheet(){ document.getElementById('sheet').hidden=true; }
function openNameSheet(){
  openSheet(`<h2>Come ti chiami?</h2><p class="dim" style="margin:6px 0 12px">Il nome compare al tavolo e nel tuo storico. Resta salvato su questo dispositivo.</p>
    <input id="nm" class="inp" maxlength="14" placeholder="Il tuo nome" value="${STORE.name}" autocomplete="off">
    <button class="btn wide" id="sv" style="margin-top:12px">Salva</button>`);
  const inp=document.getElementById('nm'); inp.focus();
  const save=async()=>{
    const v=inp.value.replace(/[<>&"'`]/g,'').trim();
    if(!v){ toast('Scrivi un nome'); return; }
    try{ if(sb) await rpc('set_name',{p_name:v}); }catch(e){ toast(errMsg(e)); return; }
    STORE.name=v; saveStore(); closeSheet();
    if(PENDING_CODE){ const c=PENDING_CODE; PENDING_CODE=null; joinByCode(c); } else if(PENDING_LEAGUE){ const c=PENDING_LEAGUE; PENDING_LEAGUE=null; joinLeagueCode(c); } else showHome();
  };
  document.getElementById('sv').onclick=save;
  inp.onkeydown=e=>{ if(e.key==='Enter') save(); };
}

let LEAGUES=[], NEWLG=null;
async function fetchLeagues(){
  try{
    const {data:mm}=await sb.from('league_members').select('league_id').eq('user_id',ME);
    const ids=(mm||[]).map(x=>x.league_id);
    if(!ids.length){ LEAGUES=[]; return; }
    const [a,b,c]=await Promise.all([
      sb.from('leagues').select('*').in('id',ids).is('deleted_at',null).order('created_at',{ascending:false}),
      sb.from('rooms').select('*').in('league_id',ids),
      sb.from('league_members').select('league_id').in('league_id',ids)]);
    const ll=a.data||[], rr=b.data||[], cm=c.data||[];
    let ss=[]; const rids=rr.map(r=>r.id);
    if(rids.length){ const {data}=await sb.from('seats').select('room_id,seat,credits').eq('user_id',ME).in('room_id',rids); ss=data||[]; }
    LEAGUES=ll.map(l=>{ const room=rr.find(r=>r.league_id===l.id)||null;
      return {lg:l, room, seat:room?(ss.find(x=>x.room_id===room.id)||null):null, members:cm.filter(x=>x.league_id===l.id).length}; });
  }catch(e){}
}

async function leagueInvite(l){
  const url=location.origin+location.pathname+'?l='+l.code, text=`Entra nella mia lega "${l.name}" su FantaManiac! Codice lega: ${l.code}`;
  try{ if(navigator.share){ await navigator.share({title:'FantaManiac',text,url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text+' '+url); toast('Invito copiato'); }catch(e){ toast('Codice lega: '+l.code); }
}

  };
  draw();

async function joinLeagueCode(code){

  try{ const id=await rpc('join_league',{p_code:code}); STORE.leagueId=id; saveStore(); closeSheet(); toast('Sei nella lega'); showHome(); }
  catch(e){ toast(errMsg(e)); }
}

function openCreate(mode){
  const R_=RULES[mode], m=MODES.find(x=>x.key===mode);

           need:R_.need?{...R_.need}:{P:3,D:8,C:8,A:6}};
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(+v)||lo));
  const maxRole = r=>Math.max(0,Math.min(12,Math.floor(CAP[r]/f.seats)));
  // limiti del Mantra: P = portieri (2-4), F = calciatori di movimento liberi; totale da 23 a 30
  const mP = ()=>[2,Math.max(2,Math.min(4,Math.floor(CAP.P/f.seats)))];
  const mF = ()=>[Math.max(0,23-f.need.P), Math.max(0,Math.min(30-f.need.P, Math.floor((CAP.D+CAP.C+CAP.A)/f.seats)))];
  const setRoles=(r)=>{
    f.roles=r;
    if(r==='mantra') f.need = mode==='turbo'?{P:2,F:16}:{P:3,F:25};
    else f.need = R_.need?{...R_.need}:{P:3,D:8,C:8,A:6};
  };

  const draw=()=>{
    const mant=f.roles==='mantra';
    if(mant && !R_.need){
      f.need.P=clamp(f.need.P,mP()[0],mP()[1]);
      f.need.F=clamp(f.need.F,mF()[0],mF()[1]);
    } else if(!mant && !R_.need) ['P','D','C','A'].forEach(r=>{ f.need[r]=Math.min(f.need[r],maxRole(r)); });
    const tot=needTotal(f.need);
    let rosterHTML;
    if(R_.need && !mant) rosterHTML=`<p class="dim" style="margin:0">${tot} calciatori: ${f.need.P} portieri, ${f.need.D} difensori, ${f.need.C} centrocampisti, ${f.need.A} attaccanti. Non si cambia.</p>`;
    else if(R_.need && mant) rosterHTML=`<p class="dim" style="margin:0">${tot} calciatori: ${f.need.P} portieri e ${f.need.F} senza vincoli di ruolo. Non si cambia.</p>`;
    else if(mant) rosterHTML=`<div class="frow" style="margin:6px 0"><span class="lbl" style="min-width:150px">Portieri (2-4)</span>${step('needP',f.need.P,mP()[0],mP()[1])}</div>
         <div class="frow" style="margin:6px 0"><span class="lbl" style="min-width:150px">Di movimento (liberi)</span>${step('needF',f.need.F,mF()[0],mF()[1])}</div>
         <p class="dim" style="margin:4px 0 0">Rosa da ${tot} calciatori (da 23 a 30). Nel Mantra non ci sono limiti di ruolo, tranne i portieri.</p>`;
    else rosterHTML=`${['P','D','C','A'].map(r=>`<div class="frow" style="margin:6px 0"><span class="lbl" style="min-width:110px">${ROLE_NAME_LONG[r][0].toUpperCase()+ROLE_NAME_LONG[r].slice(1)}</span>${step('need'+r,f.need[r],r==='P'?1:0,maxRole(r))}</div>`).join('')}
         <p class="dim" style="margin:4px 0 0">Rosa da ${tot} calciatori (massimo 30). Con ${f.seats} persone il limite per ruolo è quello indicato dal numero massimo.</p>`;
    const sheet=document.getElementById('sheet');
    const scroll=sheet.querySelector('.cwrap')?.scrollTop||0;
    openSheet(`<div class="cwrap"><h2>Crea tavolo · ${m.name}</h2>
      <div class="cf"><span class="lbl">Visibilità</span><div class="frow"><button class="chip ${!f.priv?'on':''}" data-priv="0">Pubblico</button><button class="chip ${f.priv?'on':''}" data-priv="1">Privato</button></div>
        <p class="dim cn">${f.priv?'Non compare nell’elenco: entra chi ha il codice.':'Compare nell’elenco: chiunque può sedersi.'}</p></div>
      <div class="cf"><span class="lbl">Ruoli</span><div class="frow"><button class="chip ${!mant?'on':''}" data-roles="classic">Classic</button>${mode==='super'?'<button class="chip off" data-soon="Il Superturbo si gioca con i ruoli Classic">Mantra</button>':`<button class="chip ${mant?'on':''}" data-roles="mantra">Mantra</button>`}</div>
        <p class="dim cn">${mant?'Mantra: rosa senza vincoli di ruolo (almeno 2 portieri). Ogni calciatore ha i suoi ruoli Mantra.':'Classic: portieri, difensori, centrocampisti, attaccanti.'}</p></div>
      <div class="cf"><span class="lbl">Chiamata</span><div class="frow"><button class="chip ${f.call==='random'?'on':''}" data-call="random">Random</button><button class="chip ${f.call==='chiamata'?'on':''}" data-call="chiamata">A chiamata</button><button class="chip ${f.call==='draft'?'on':''}" data-call="draft">Draft</button></div>

            <div class="fact"><b>Gratis</b><span>ingresso</span></div>
            <div class="fact"><b>${total}</b><span>calciatori in rosa</span></div>
            <div class="fact"><b>${t.max_seats-t.filled}</b><span>posti liberi</span></div>
          </div>
          <ul class="rules">${tableRules(t).map(r=>`<li>${r}</li>`).join('')}</ul>
          <button class="btn wide" data-join="${t.id}" ${full?'disabled':''}>${full?'Asta in partenza':'Siediti al tavolo'}</button>
        </div>`;
      }
      return html;
    }).join('') : `<div class="empty-l">Nessun tavolo aperto. Creane uno e invita gli amici col codice.</div>`);
  el.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sort; if(L.sort===k) L.dir*=-1; else {L.sort=k;L.dir=1}
    renderRows();
  });
  el.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.row; L.sel = L.sel===id?null:id; renderRows();
  });
  el.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{
    const t=TABLES.find(x=>x.id===b.dataset.join);
    if(t && t.filled<t.max_seats) joinTable(t);
  });
}

/* ---------- TAVOLO OVALE ---------- */
// slots: un elemento per posto (null = libero). meIdx: posto di chi guarda (in basso).
function ovalHTML(center, slots, meIdx, info){
  const n=slots.length;
  if(n>12){
    // tanti posti: niente ovale, un riquadro centrale e la griglia dei partecipanti
    const order=slots.map((s,i)=>i);
    return `<div class="flatwrap"><div class="flatc">${center}</div><div class="seatgrid">${order.map(i=>{
      const s=slots[i], d=info(s,i);
      return `<div class="gseat ${d.cls||''}">${d.dealer?'<span class="dchip" title="Tocca a lui chiamare">C</span>':''}<div class="av">${d.av}</div><div class="nm">${d.name}</div><div class="cr">${d.sub}</div></div>`;
    }).join('')}</div></div>`;
  }
  return `<div class="oval-wrap ${n>6?'dense':''}"><div class="oval"></div>${slots.map((s,i)=>{
    const k=(i-meIdx+n)%n, a=k*2*Math.PI/n, x=50+38*Math.sin(a), y=50+41*Math.cos(a), d=info(s,i);
    return `<div class="oseat ${d.cls||''}" style="left:${x}%;top:${y}%">${d.dealer?'<span class="dchip" title="Tocca a lui chiamare">C</span>':''}<div class="av">${d.av}</div><div class="nm">${d.name}</div><div class="cr">${d.sub}</div></div>`;
  }).join('')}<div class="ocenter">${center}</div></div>`;
}

/* ---------- STANZA (sala d'attesa + asta) ---------- */
let RV = null, R = null, SEATS = [], POOL = [], LOG = [];
const open = s=>['P','D','C','A','F'].reduce((a,r)=>a+((s.need&&s.need[r])||0),0);
const maxBid = s=>open(s)>0 ? s.credits-(open(s)-1) : 0;
const sName = i=>(SEATS.find(s=>s.seat===i)||{}).name||'';
const meSeat = ()=>SEATS.find(s=>s.user_id===ME);
const curP = ()=>R&&R.cur_pid!=null?POOL.find(p=>p.pid===R.cur_pid):null;
const tms = v=>v?new Date(v).getTime():0;

function setRoom(n){
  if(!n||!n.id) return;
  if(R && R.id===n.id){
    if(tms(n.updated_at)<tms(R.updated_at)) return;
    if(R.last_sale&&n.last_sale&&R.last_sale.at!==n.last_sale.at) RV.needSeats=true;
    if(R.status!==n.status && n.status==='running') RV.needPool=true;
  }
  R=n;
}
async function loadAll(){
  const id=RV.id;
  const [r,s,p,l]=await Promise.all([
    sb.from('rooms').select('*').eq('id',id).single(),
    sb.from('seats').select('*').eq('room_id',id).order('seat'),
    sb.from('pool').select('*').eq('room_id',id).limit(1000),
    sb.from('log').select('*').eq('room_id',id).order('id',{ascending:false}).limit(8)]);
  if(r.error) throw r.error;
  R=r.data; SEATS=s.data||[]; POOL=p.data||[]; LOG=(l.data||[]).map(x=>x.msg);
}
async function refetchSeats(){
  if(!RV) return;
  const {data}=await sb.from('seats').select('*').eq('room_id',RV.id).order('seat');
  if(data && RV) SEATS=data;
}
async function refetchPool(){
  if(!RV) return;
  const {data}=await sb.from('pool').select('*').eq('room_id',RV.id).limit(1000);
  if(data && RV) POOL=data;
}
async function enterRoom(id){
  leaveRoomView(); stopLobby(); setNav(false);
  RV={id, tickBusy:false, sig:'', renderT:null, needSeats:false, needPool:false, saved:false, soldOn:false, polls:0};
  try{ await loadAll(); }catch(e){ toast(errMsg(e)); leaveRoomView(); return showHome(); }
  RV.chan=sb.channel('room-'+id)
    .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'id=eq.'+id},pl=>{ if(RV){ setRoom(pl.new); scheduleRender(); } })
    .on('postgres_changes',{event:'*',schema:'public',table:'seats',filter:'room_id=eq.'+id},()=>{ if(RV){ RV.needSeats=true; scheduleRender(); } })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'pool',filter:'room_id=eq.'+id},pl=>{
      if(!RV) return; const i=POOL.findIndex(p=>p.pid===pl.new.pid); if(i>=0) POOL[i]=pl.new; scheduleRender(); })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'log',filter:'room_id=eq.'+id},pl=>{
      if(!RV) return; LOG.unshift(pl.new.msg); LOG=LOG.slice(0,8); scheduleRender(); })
    .subscribe();
  RV.tickT=setInterval(doTick,800);
  RV.uiT=setInterval(uiTick,200);
  RV.pollT=setInterval(pollState,3000);
  RV.sig=''; renderRoom();
}
function leaveRoomView(){
  if(!RV) return;
  clearInterval(RV.tickT); clearInterval(RV.uiT); clearInterval(RV.pollT); clearTimeout(RV.renderT);
  if(RV.chan && sb) sb.removeChannel(RV.chan);
  RV=null; R=null; SEATS=[]; POOL=[]; LOG=[];
}
function scheduleRender(){
  if(!RV) return; clearTimeout(RV.renderT);
  RV.renderT=setTimeout(async()=>{
    if(!RV) return;
    if(RV.needSeats){ RV.needSeats=false; await refetchSeats(); }
    if(RV && RV.needPool){ RV.needPool=false; await refetchPool(); }
    if(RV) renderRoom();
  },60);
}
async function doTick(){
  if(!RV||RV.tickBusy||!R||R.status!=='running') return;
  RV.tickBusy=true;
  try{ const d=await rpc('tick_room',{p_room:RV.id}); if(RV&&d){ setRoom(d); scheduleRender(); } }
  catch(e){} finally{ if(RV) RV.tickBusy=false; }
}
async function pollState(){
  if(!RV) return;
  try{
    const {data}=await sb.from('rooms').select('*').eq('id',RV.id).single();
    if(!RV) return; if(data) setRoom(data);
    await refetchSeats();
    RV.polls++;
    if(R&&R.status!=='open' && (POOL.length===0 || RV.polls%3===0)) await refetchPool();
    if(RV) scheduleRender();
  }catch(e){}
}
function soldFresh(){ return R&&R.last_sale&&R.phase==='calling'&&(nowS()-R.last_sale.at)<1700; }
function sigOf(){
  return JSON.stringify([R.status,R.phase,R.cur_pid,R.cur_bid,R.cur_leader,R.passed,R.caller_seat,R.lot_n,R.filled,
    R.last_sale&&R.last_sale.at, soldFresh(), SEATS.map(s=>[s.seat,s.credits,s.name,open(s)]), POOL.length, LOG[0]]);
}
function renderRoom(){
  if(!RV||!R) return;
  const sg=sigOf(); if(sg===RV.sig) return; RV.sig=sg;
  if(R.status==='open') renderWaiting();
  else if(R.status==='done') renderFinished();
  else renderAuction();
}
function uiTick(){
  if(!RV||!R) return;
  if(R.phase==='bidding'&&R.deadline){
    const total=(R.bid_time*1000), left=Math.max(0,tms(R.deadline)-nowS());
    const bar=document.getElementById('tbar'), tt=document.getElementById('ttxt');
    if(bar){ bar.firstElementChild.style.width=Math.min(100,left/Math.max(total,left)*100)+'%'; bar.classList.toggle('low',left<3000); }
    if(tt) tt.textContent=(left/1000).toFixed(1)+' s';
  }
  const f=soldFresh(); if(f!==RV.soldOn){ RV.soldOn=f; renderRoom(); }
}

function inviteText(){ return `Entra nella mia asta su FantaManiac! Codice tavolo: ${R.code}`; }
function inviteUrl(){ return location.origin+location.pathname+'?t='+R.code; }
async function invite(){
  const data={title:'FantaManiac',text:inviteText(),url:inviteUrl()};
  try{ if(navigator.share){ await navigator.share(data); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(inviteText()+' '+inviteUrl()); toast('Invito copiato'); }
  catch(e){ toast('Codice: '+R.code); }
}

function canClose(){ return R && R.host===ME && R.status!=='done' && SEATS.some(x=>x.is_bot) && !SEATS.some(x=>!x.is_bot && x.user_id && x.user_id!==ME); }
async function closeTable(){
  if(!confirm('Chiudere il tavolo? L\u2019asta con i bot verr\u00e0 terminata.')) return;
  const id=R.id;
  try{ await rpc('close_table',{p_room:id}); leaveRoomView(); toast('Tavolo chiuso'); showLobby(); }
  catch(e){ toast(errMsg(e)); }
}
function closeBtn(){ return canClose()?'<button class="btn ghost" id="closetbl" style="margin-left:6px">Chiudi tavolo</button>':''; }
function bindClose(){ const b=document.getElementById('closetbl'); if(b) b.onclick=closeTable; }

function renderWaiting(){
  const slots=Array.from({length:R.max_seats},(_,i)=>SEATS.find(s=>s.seat===i)||null);
  const meIdx=Math.max(0,slots.findIndex(s=>s&&s.user_id===ME));

    ${ovalHTML(`<div class="dim" style="font-size:13px">Posti occupati</div><div class="big-count" style="font-size:56px">${SEATS.length}/${R.max_seats}</div>`, slots, meIdx,
      (s,i)=> s ? {cls:s.user_id===ME?'me':'', av:s.is_bot?'\u2699':s.name[0], name:s.name, sub:s.credits+' cr'} : {cls:'empty', av:'?', name:'Libero', sub:'\u00a0'})}
    <div class="codebox"><span class="dim">Codice tavolo</span><b class="code">${R.code}</b><button class="btn" id="invite">Invita gli amici</button></div>
    ${isHost?`<button class="btn wide ghost" id="fillbots" style="margin-top:12px">Riempi i posti liberi con i bot e avvia</button>`:`<p class="note">L\u2019asta parte da sola quando tutti i posti sono occupati.</p>`}`;
  document.getElementById('invite').onclick=invite;
  bindClose();

  document.getElementById('leave').onclick=async()=>{

const rb=(p,mant)=>mant&&p.rm?`<span class="role ${p.role} rmb">${p.rm.replace(/;/g,' ')}</span>`:`<span class="role ${p.role}">${p.role}</span>`;
function rosterHTML(){
  const me=meSeat(); if(!me) return '';
  const mine=POOL.filter(p=>p.owner_seat===me.seat);
  const rows=[], mant=('F' in me.need);
  const tag=p=>`${p.team?` <small class="tm">${p.team}</small>`:''}`;
  for(const r of ['P','D','C','A']){
    mine.filter(p=>p.role===r).forEach(p=>rows.push(`<div class="rrow">${rb(p,mant)}${p.name}${tag(p)}<span class="p">${p.price}</span></div>`));
    if(!mant) for(let k=0;k<(me.need[r]||0);k++) rows.push(`<div class="rrow empty"><span class="role ${r}">${r}</span>da acquistare</div>`);
  }
  if(mant){
    for(let k=0;k<(me.need.P||0);k++) rows.push(`<div class="rrow empty"><span class="role P">P</span>portiere da acquistare</div>`);
    for(let k=0;k<(me.need.F||0);k++) rows.push(`<div class="rrow empty"><span class="role">\u2022</span>posto libero</div>`);
  }
  return `<details class="roster"><summary>La mia rosa</summary>${rows.join('')}</details>`;
}
let PICK_ROLE=null, PICK_Q='';
const norm = t=>(t||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const MR=['Por','Dd','Dc','Ds','B','E','M','C','W','T','A','Pc'];
const MR_NAME={Por:'Por',Dd:'Dd',Dc:'Dc',Ds:'Ds',B:'B',E:'E',M:'M',C:'C',W:'W',T:'T',A:'A',Pc:'Pc'};
const isM = me=>('F' in me.need);
function pickTabs(me){
  const roles=['P','D','C','A'].filter(r=>slotOf(me.need,r)!==null);
  if(!isM(me)) return roles.map(r=>[r,ROLE_NAME[r]]);
  return MR.filter(t=>t==='Por'?roles.includes('P'):roles.some(r=>r!=='P')).map(t=>[t,t]);
}
function pickList(me){
  const roles=['P','D','C','A'].filter(r=>slotOf(me.need,r)!==null), q=norm(PICK_Q.trim()), mt=isM(me);
  const base=POOL.filter(p=>p.owner_seat==null&&(q?roles.includes(p.role):(mt?roles.includes(p.role)&&(p.rm||'').split(';').includes(PICK_ROLE):p.role===PICK_ROLE)));
  const list=q?base.filter(p=>norm(p.name).includes(q)||norm(p.team).includes(q)):base;
  return list.sort((a,b)=>b.q-a.q);
}
function pickRowsHTML(me,list){
  if(!list.length) return '<p class="dim" style="padding:10px">Nessun calciatore trovato.</p>';
  return list.map(p=>`<button class="prow" data-pick="${p.pid}">${rb(p,'F' in me.need)}<span class="nm">${p.name}${p.team?`<small class="tm">${p.team}</small>`:''}</span><span class="q">${p.q}</span></button>`).join('');
}
function bindPick(){
  $app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{
    try{ const d=await rpc('call_player',{p_room:R.id,p_pid:+b.dataset.pick}); PICK_Q=''; setRoom(d); scheduleRender(); }
    catch(e){ toast(errMsg(e)); await refetchPool(); RV.sig=''; renderRoom(); }
  });
}
function renderAuction(){
  const me=meSeat();
  const slots=Array.from({length:R.max_seats},(_,i)=>SEATS.find(s=>s.seat===i)||null);
  const meIdx=Math.max(0,slots.findIndex(s=>s&&s.user_id===ME));
  const total=open({need:R.need});
  const manual = R.call==='chiamata' || R.call==='draft', draft = R.call==='draft';
  const passed = R.passed||[];
  let center='', below='';
  const fresh = soldFresh();
  if(R.phase==='calling' && !fresh){
    const myTurn = me && R.caller_seat===me.seat;
    center=`<div class="dim" style="font-size:13px">${draft?'Draft':manual?'Chiamata':'Estrazione'}</div><div class="pname">${!manual?'a sorte':myTurn?'Tocca a te':sName(R.caller_seat)}</div>`;
    if(myTurn && manual){
      const tabs=pickTabs(me);
      if(!PICK_ROLE || !tabs.some(t=>t[0]===PICK_ROLE)) PICK_ROLE=tabs[0][0];
      const list=pickList(me);
      below=`<div class="panel">
        <p class="dim">${draft?'Scegli un giocatore: è subito tuo, senza rilanci. Hai pochi secondi, poi scelgo io.':'Scegli un giocatore: l’offerta parte da 1 credito a tuo nome. Hai pochi secondi, poi scelgo io.'}</p>
        <input id="psearch" class="inp" type="search" placeholder="Cerca un calciatore o una squadra\u2026" value="${PICK_Q.replace(/"/g,'&quot;')}" autocomplete="off" autocapitalize="off" style="margin-bottom:8px;min-height:46px">
        <div class="tabs" id="ptabs" ${PICK_Q.trim()?'hidden':''}>${tabs.map(t=>`<button class="tab ${t[0]===PICK_ROLE?'on':''}" data-role="${t[0]}">${t[1]}</button>`).join('')}</div>
        <div class="plist">${pickRowsHTML(me,list)}</div>
        <p class="msg">Il numero a destra \u00e8 la quotazione di riferimento.</p>
      </div>`;
    } else center+=`<p class="msg dim">${manual?'sta scegliendo\u2026':'sorteggio in corso\u2026'}</p>`;
  } else {
    const sale=fresh?R.last_sale:null;
    const p=sale?{role:sale.role,name:sale.name}:curP();
    const price=sale?sale.price:R.cur_bid;
    const leader=sale?sale.seat:R.cur_leader;
    const canBid = !sale && me && p && slotOf(me.need,p.role)!==null && !passed.includes(me.seat) && R.cur_leader!==me.seat;
    const mb=me?maxBid(me):0;
    let status;
    if(sale) status=draft?`Scelto da ${sName(leader)}`:`Venduto a ${sName(leader)}`;
    else if(me&&R.cur_leader===me.seat) status='Sei in testa';
    else if(me&&p&&slotOf(me.need,p.role)===null) status='Rosa completa in questo ruolo';
    else if(me&&passed.includes(me.seat)) status='Hai passato';
    else status=`In testa: ${sName(leader)}`;
    if(p) center=`${rb(p,R.roles==='mantra')}<div class="pname">${p.name}</div><div class="price" aria-live="polite">${price}</div><div class="msg">${status}</div>`;
    if(!sale) below=`<div class="tbar" id="tbar"><i></i></div><div class="dim" id="ttxt" style="font-size:14px;text-align:center"></div>
      <div class="actions">
        ${[1,5,10].map(n=>`<button class="btn" data-bid="${n}" ${canBid&&price+n<=mb?'':'disabled'}>+${n}</button>`).join('')}
        <button class="btn ghost fold" data-pass ${canBid?'':'disabled'}>Passo</button>
      </div>
      <p class="msg" style="text-align:center">Puoi offrire al massimo ${mb} crediti: ne servono altri per i posti ancora vuoti.</p>`;
  }
  const oval=ovalHTML(center, slots, meIdx, (s,i)=>{
    if(!s) return {cls:'empty',av:'?',name:'Libero',sub:'\u00a0'};
    const cls=[]; if(s.user_id===ME) cls.push('me');
    if(R.phase==='bidding'){
      if(i===R.cur_leader) cls.push('lead');
      const p=curP();
      if(passed.includes(i)||(p&&slotOf(s.need,p.role)===null)) cls.push('out');
    }
    if(fresh && i===R.last_sale.seat) cls.push('lead');
    return {cls:cls.join(' '), av:s.is_bot?'\u2699':s.name[0], name:s.name,
      sub:draft?`${total-open(s)}/${total}`:R.max_seats>6?`${s.credits}`:`${s.credits} cr · ${total-open(s)}/${total}`, dealer:i===R.caller_seat && R.phase==='calling' && !fresh};
  });
  const keepOpen = document.querySelector('details.roster')?.open;
  const hadSearch = document.activeElement && document.activeElement.id==='psearch', selS = hadSearch?document.activeElement.selectionStart:0;
  const sc = document.querySelector('.plist')?.scrollTop||0;
  $app.innerHTML = `
    <div class="topbar"><h2>Tavolo ${R.code}</h2><span>${closeBtn()}<button class="btn ghost" id="leave">Esci</button></span></div>
    ${oval}
    ${below}
    <div class="log">${LOG.slice(0,4).map(l=>`<div>${l}</div>`).join('')}</div>
    ${rosterHTML()}`;
  if(keepOpen) document.querySelector('details.roster').open=true;
  const pl=document.querySelector('.plist'); if(pl) pl.scrollTop=sc;
  document.getElementById('leave').onclick=()=>{ leaveRoomView(); toast('Puoi rientrare dalla Home'); showHome(); };
  bindClose();
  $app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{PICK_ROLE=b.dataset.role;RV.sig='';renderRoom()});
  bindPick();
  const ps_=document.getElementById('psearch');
  if(ps_){
    if(hadSearch){ ps_.focus(); try{ ps_.setSelectionRange(selS,selS); }catch(e){} }
    ps_.oninput=()=>{
      PICK_Q=ps_.value; const meS=meSeat(); if(!meS) return;
      const tabs=document.getElementById('ptabs'); if(tabs) tabs.hidden=!!PICK_Q.trim();
      const pl=$app.querySelector('.plist'); if(pl){ pl.innerHTML=pickRowsHTML(meS,pickList(meS)); pl.scrollTop=0; bindPick(); }
    };
  }
  $app.querySelectorAll('[data-bid]').forEach(b=>b.onclick=async()=>{
    try{ const d=await rpc('place_bid',{p_room:R.id,p_amount:R.cur_bid+ +b.dataset.bid}); setRoom(d); scheduleRender(); }
    catch(e){ toast(errMsg(e)); }
  });
  const ps=$app.querySelector('[data-pass]'); if(ps) ps.onclick=async()=>{
    try{ const d=await rpc('pass_bid',{p_room:R.id}); setRoom(d); scheduleRender(); }catch(e){ toast(errMsg(e)); }
  };
  uiTick();
}

function renderFinished(){
  const cfg=R;
  if(!RV.saved){
    RV.saved=true;
    const me=meSeat();
    if(me){
      STORE.history.unshift({ts:Date.now(), table:'Tavolo '+cfg.code, mode:cfg.mode, scope:'', room:cfg.id, lineup:(cfg.mode!=='super'), credits:cfg.credits, spent:cfg.credits-me.credits,
        roles:cfg.roles, roster:POOL.filter(p=>p.owner_seat===me.seat).map(p=>({name:p.name,role:p.role,rm:p.rm,price:p.price}))});
      STORE.history=STORE.history.slice(0,30); saveStore();
    }
    refetchPool().then(()=>{ if(RV){ RV.sig=''; renderRoom(); } });
  }
  setNav(true,'home');
  $app.innerHTML = `
    <h1 style="padding-top:16px">Asta finita</h1>
    <p class="dim">Ecco le rose finali del tavolo ${cfg.code}.</p>
    ${SEATS.map(s=>{
      const spent=cfg.credits-s.credits;
      return `<div class="res ${s.user_id===ME?'me':''}">
        <h3><span>${s.name}</span><span class="dim" style="font-size:16px;font-family:Barlow,sans-serif">speso ${spent} \u00b7 restano ${s.credits}</span></h3>
        ${['P','D','C','A'].flatMap(r=>POOL.filter(p=>p.owner_seat===s.seat&&p.role===r)).map(p=>`<div class="rrow">${rb(p,cfg.roles==='mantra')}${p.name}${p.team?` <small class="tm">${p.team}</small>`:''}<span class="p">${p.price}</span></div>`).join('')}
      </div>`;
    }).join('')}
    <div style="display:grid;gap:8px;margin-top:18px">${(cfg.mode!=='super'&&meSeat())?'<button class="btn wide" id="lineup">Schiera la formazione</button>':''}<button class="btn wide ${(cfg.mode!=='super')?'ghost':''}" id="again">Torna alla Home</button></div>
    <p class="note">${cfg.mode==='classic'?'Prossimo passo: dare un punteggio alle rose con i voti della giornata e fare una classifica.':'Questa rosa vale solo per la giornata o la partita del tavolo. Poi si azzera e puoi rifare un\u2019asta.'}</p>`;
  document.getElementById('again').onclick=()=>{ leaveRoomView(); showHome(); };
  const lb=document.getElementById('lineup'); if(lb) lb.onclick=()=>{ const id=cfg.id; leaveRoomView(); showLineup(id); };
}

/* ---------- FORMAZIONE (Classic e Mantra) ---------- */
const CLASSIC_MODS = ['3-4-3','3-5-2','4-3-3','4-4-2','4-5-1','5-3-2','5-4-1'];
// Griglia Mantra: per ogni posto i ruoli ammessi (alternativi, separati da |). Ricostruita dalle regole di fantacalcio.it
const MANTRA_GRID = {
  '3-4-3':  ['Por','Dc|B','Dc|B','Dc|B','E','M|C','M|C','E','W|A','A|Pc','W|A'],
  '3-4-1-2':['Por','Dc|B','Dc|B','Dc|B','E','M|C','M|C','E','T','A|Pc','A|Pc'],
  '3-4-2-1':['Por','Dc|B','Dc|B','Dc|B','E','M|C','M|C','E','W|T','W|T','A|Pc'],
  '3-5-2':  ['Por','Dc|B','Dc|B','Dc|B','E','M|C','C','M|C','E','A|Pc','A|Pc'],
  '3-5-1-1':['Por','Dc|B','Dc|B','Dc|B','E','M|C','C','M|C','E','T|A','A|Pc'],
  '4-3-3':  ['Por','Dd','Dc','Dc','Ds','M|C','C','M|C','W|A','A|Pc','W|A'],
  '4-3-1-2':['Por','Dd','Dc','Dc','Ds','M|C','C','M|C','T','A|Pc','A|Pc'],
  '4-4-2':  ['Por','Dd','Dc','Dc','Ds','E|W','M|C','M|C','E|W','A|Pc','A|Pc'],
  '4-1-4-1':['Por','Dd','Dc','Dc','Ds','M','E|W','C','C','E|W','A|Pc'],
  '4-4-1-1':['Por','Dd','Dc','Dc','Ds','E|W','M|C','M|C','E|W','T|A','A|Pc'],
  '4-2-3-1':['Por','Dd','Dc','Dc','Ds','M','M|C','W|T','T','W|T','A|Pc']
};
let LU = null;
const luMant = ()=>LU.room.roles==='mantra';
const luMods = ()=>luMant()?Object.keys(MANTRA_GRID):CLASSIC_MODS;
const luBy = pid=>LU.mine.find(p=>p.pid===pid);
const rmOf = p=>(p.rm||'').split(';').filter(Boolean);
function luSpec(m){
  if(luMant()) return MANTRA_GRID[m].map(g=>({label:g.replace(/\|/g,'/'), test:p=>rmOf(p).some(r=>g.split('|').includes(r))}));
  const [d,c,a]=m.split('-').map(Number), out=[{label:'P',test:p=>p.role==='P'}];
  [['D',d],['C',c],['A',a]].forEach(([r,n])=>{ for(let i=0;i<n;i++) out.push({label:r,test:p=>p.role===r}); });
  return out;
}
const luLines = m=>luMant()?[1,...m.split('-').map(Number)]:[1,...m.split('-').map(Number)];
// abbina il piu' alto numero di calciatori ai posti (Kuhn); "keep" = assegnazioni da mantenere se valide
function luMatch(spec, players, keep){
  const at=Array(spec.length).fill(null), used=new Set();
  if(keep) keep.forEach((pid,i)=>{ const p=pid!=null&&players.find(x=>x.pid===pid); if(p&&spec[i]&&spec[i].test(p)&&!used.has(pid)){ at[i]=pid; used.add(pid); } });
  const matchP={}; at.forEach((pid,i)=>{ if(pid!=null) matchP[pid]=i; });
  const free=players.filter(p=>!used.has(p.pid));
  const tryS=(i,seen)=>{ for(const p of free){ if(spec[i].test(p)&&!seen.has(p.pid)){ seen.add(p.pid); if(matchP[p.pid]==null||tryS(matchP[p.pid],seen)){ matchP[p.pid]=i; return true; } } } return false; };
  for(let i=0;i<spec.length;i++) if(at[i]==null) tryS(i,new Set());
  const res=Array(spec.length).fill(null);
  Object.entries(matchP).forEach(([pid,i])=>{ res[i]=+pid; });
  return res;
}
function luFeasible(m){ return luMatch(luSpec(m),LU.mine).every(x=>x!=null); }
const luStarters = ()=>LU.slots.filter(x=>x!=null);
function luRebench(){
  const st=new Set(luStarters()), have=new Set(LU.mine.map(p=>p.pid));
  const keep=LU.bench.filter(x=>have.has(x)&&!st.has(x));
  const rest=LU.mine.filter(p=>!st.has(p.pid)&&!keep.includes(p.pid))
    .sort((a,b)=>'PDCA'.indexOf(a.role)-'PDCA'.indexOf(b.role)||(b.price||0)-(a.price||0)).map(p=>p.pid);
  LU.bench=[...keep,...rest];
}
function luSetModule(m){
  const spec=luSpec(m), cur=LU.slots.map(x=>x), players=LU.mine.filter(p=>cur.includes(p.pid));
  LU.module=m; LU.slots=luMatch(spec,players,LU.slots.length===spec.length?cur:null);
  luRebench();
}
const SHIRT='<svg viewBox="0 0 100 96" aria-hidden="true"><path d="M32 4L50 12L68 4L96 22L82 44L70 38V92H30V38L18 44L4 22Z"/></svg>';
async function showLineup(roomId, md, from){
  stopTick(); stopLobby(); setNav(false);
  $app.innerHTML='<div class="empty-l" style="padding-top:30vh">Carico la tua rosa…</div>';
  try{
    const {data:room}=await sb.from('rooms').select('*').eq('id',roomId).single();
    const {data:seat}=await sb.from('seats').select('*').eq('room_id',roomId).eq('user_id',ME).maybeSingle();
    if(!room||!seat) throw new Error('Non trovo la tua rosa in questo tavolo');
    const {data:mine}=await sb.from('pool').select('*').eq('room_id',roomId).eq('owner_seat',seat.seat);
    md=md||1;
    const {data:ex}=await sb.from('lineups').select('*').eq('room_id',roomId).eq('seat',seat.seat).eq('md',md).maybeSingle();
    LU={from:from||(LU&&LU.from)||'hist',room,seat:seat.seat,mine:mine||[],md,module:'4-4-2',slots:Array(11).fill(null),bench:[],saved:!!ex};
    const mods=luMods(), first=(luFeasible('4-4-2')?'4-4-2':mods.find(luFeasible))||'4-4-2';
    if(ex && mods.includes(ex.module) && ex.starters.length===11){
      LU.module=ex.module; LU.slots=ex.starters.map(x=>luBy(x)?x:null); LU.bench=ex.bench||[]; luRebench();
    } else { LU.module=first; LU.slots=Array(11).fill(null); luRebench(); }
    renderLineup();
  }catch(e){ toast(errMsg(e)); showHome(); }
}
function renderLineup(){
  const L_=LU, r_=L_.room, n=luStarters().length, spec=luSpec(L_.module), lines=luLines(L_.module), mant=luMant();
  const slot=(i)=>{ const pid=L_.slots[i], p=pid!=null?luBy(pid):null, rl=p?(p.role):spec[i].label[0];
    return `<button class="pslot ${p?'':'empty'}" data-si="${i}"><span class="kit ${p?p.role:'X'}">${SHIRT}<em>${p?(mant&&p.rm?p.rm.split(';')[0]:p.role):'+'}</em></span><span class="pn">${p?p.name.split(' ').slice(-1)[0]:(spec[i].label.length>3?spec[i].label.split('/')[0]:spec[i].label)}</span>${spec[i].label.length>1&&mant?`<small class="pl">${spec[i].label}</small>`:''}</button>`; };
  let idx=0; const rows=lines.map(sz=>{ const items=[]; for(let k=0;k<sz;k++) items.push(slot(idx++)); return `<div class="pline">${items.join('')}</div>`; });
  const pitch=rows.reverse().join('');
  const bn=L_.bench, cut=mant?12:bn.length;
  const benchRow=(pid,i)=>{ const p=luBy(pid); return `<div class="rrow bn ${i>=cut?'out':''}"><span class="bnn">${i+1}</span>${rb(p,mant)}${p.name}${p.team?` <small class="tm">${p.team}</small>`:''}<span class="mv"><button data-up="${i}" ${i?'':'disabled'} aria-label="Su">▲</button><button data-dn="${i}" ${i<bn.length-1?'':'disabled'} aria-label="Giù">▼</button></span></div>`; };
  $app.innerHTML = `
    <div class="tb"><button class="back" id="lu-back" aria-label="Indietro">${IC.back}</button><h1 class="tb-t">Formazione</h1><span style="width:48px"></span></div>
    <p class="tag" style="margin-bottom:10px">${modeName(r_.mode)} · ${mant?'Mantra':'Classic'} · Tavolo ${r_.code}</p>
    ${r_.days>1?`<div class="frow" style="margin-bottom:10px"><span class="lbl">Giornata</span>${Array.from({length:r_.days},(_,i)=>`<button class="chip ${L_.md===i+1?'on':''}" data-md="${i+1}">${i+1}</button>`).join('')}</div>`:''}
    <div class="frow" style="margin-bottom:12px"><span class="lbl">Modulo</span>${luMods().map(m=>`<button class="chip ${m===L_.module?'on':''} ${luFeasible(m)?'':'off'}" data-mod="${m}">${m}</button>`).join('')}</div>
    <div class="pitch"><div class="mk"><i class="half"></i><i class="cc"></i><i class="box"></i><i class="six"></i><i class="arc"></i><i class="box t"></i><i class="six t"></i></div><div class="plines">${pitch}</div></div>
    <p class="dim" style="margin:8px 0 12px">${n}/11 titolari. Tocca un posto per scegliere il calciatore.${mant?' Le sigle sotto ai posti sono i ruoli ammessi.':''}</p>
    <h2 class="sec" style="font-size:22px">Panchina</h2>
    <p class="dim" style="margin:0 0 6px;font-size:13px">${mant?'Entrano nell’ordine in cui li metti. Valgono i primi 12, con almeno un portiere; gli altri restano fuori distinta.':'Entrano nell’ordine in cui li metti. Usa le frecce per cambiare l’ordine.'}</p>
    ${bn.map(benchRow).join('')||'<p class="dim">Nessun calciatore in panchina.</p>'}
    <button class="btn wide" id="lu-save" style="margin-top:16px">${L_.saved?'Aggiorna la formazione':'Salva la formazione'}</button>
    <p class="note">I punteggi arrivano quando colleghiamo i voti della Serie A. Intanto la formazione resta salvata.${mant?' La griglia dei ruoli per ogni modulo è ricostruita dalle regole di fantacalcio.it: se un posto ti sembra sbagliato, dimmelo.':''}</p>`;
  document.getElementById('lu-back').onclick=()=>{ const f=LU.from; LU=null; f==='home'?showHome():showHistory(); };
  $app.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>showLineup(r_.id,+b.dataset.md,L_.from));
  $app.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{
    if(!luFeasible(b.dataset.mod)){ toast('Con questa rosa non puoi usare questo modulo'); return; }
    luSetModule(b.dataset.mod); L_.saved=false; renderLineup(); });
  $app.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [L_.bench[i-1],L_.bench[i]]=[L_.bench[i],L_.bench[i-1]]; L_.saved=false; renderLineup(); });
  $app.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; [L_.bench[i+1],L_.bench[i]]=[L_.bench[i],L_.bench[i+1]]; L_.saved=false; renderLineup(); });
  $app.querySelectorAll('[data-si]').forEach(b=>b.onclick=()=>luPick(+b.dataset.si));
  document.getElementById('lu-save').onclick=async()=>{
    const miss=11-luStarters().length;
    if(miss>0){ toast(`Mancano ${miss} titolari`); return; }
    if(mant && !L_.bench.slice(0,12).some(pid=>luBy(pid).role==='P')){ toast('In panchina serve almeno un portiere tra i primi 12'); return; }
    const bt=document.getElementById('lu-save'); bt.disabled=true;
    try{
      await rpc('save_lineup',{p_room:r_.id,p_md:L_.md,p_module:L_.module,p_starters:L_.slots,p_bench:L_.bench});
      L_.saved=true; toast('Formazione salvata'); renderLineup();
    }catch(e){ toast(errMsg(e)); bt.disabled=false; }
  };
}
function luPick(i){
  const spec=luSpec(LU.module)[i], st=new Set(luStarters()), cur=LU.slots[i], mant=luMant();
  const list=LU.mine.filter(p=>spec.test(p)&&!st.has(p.pid)).sort((a,b)=>(b.price||0)-(a.price||0));
  openSheet(`<h2>${spec.label}</h2>
    <div class="plist" style="max-height:52vh">${list.map(p=>`<button class="prow" data-take="${p.pid}">${rb(p,mant)}<span class="nm">${p.name}${p.team?`<small class="tm">${p.team}</small>`:''}</span><span class="q">${p.price}</span></button>`).join('')||'<p class="dim" style="padding:10px">Nessun altro calciatore adatto a questo posto.</p>'}</div>
    ${cur!=null?'<button class="btn wide ghost" id="lu-free" style="margin-top:10px">Libera il posto</button>':''}
    <button class="btn wide" data-close style="margin-top:10px">Chiudi</button>`);
  document.querySelector('#sheet .btn[data-close]').onclick=closeSheet;
  document.querySelectorAll('#sheet [data-take]').forEach(b=>b.onclick=()=>{
    LU.slots[i]=+b.dataset.take; luRebench(); LU.saved=false; closeSheet(); renderLineup(); });
  const fr=document.getElementById('lu-free'); if(fr) fr.onclick=()=>{ LU.slots[i]=null; luRebench(); LU.saved=false; closeSheet(); renderLineup(); };
}

/* ---------- AVVIO ---------- */
function showSetup(){
  setNav(false);
  $app.innerHTML=`<div class="empty-state" style="margin-top:20vh"><h2>Manca la configurazione</h2><p class="dim">Questa copia dell\u2019app non \u00e8 ancora collegata al server. Servono l\u2019indirizzo del progetto Supabase e la chiave pubblica, da inserire all\u2019inizio del file.</p></div>`;
}
function showNetError(e){
  setNav(false);
  $app.innerHTML=`<div class="empty-state" style="margin-top:20vh"><h2>Non riesco a collegarmi</h2><p class="dim">${errMsg(e)}</p><button class="btn wide" style="margin-top:16px" onclick="location.reload()">Riprova</button></div>`;
}
async function boot(){
  loadStore();
  if(!window.supabase || SUPABASE_URL.indexOf('__')===0){ return showSetup(); }
  $app.innerHTML='<div class="empty-l" style="padding-top:40vh">Un attimo\u2026</div>';
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    let {data:{session}}=await sb.auth.getSession();
    if(!session){ const r=await sb.auth.signInAnonymously(); if(r.error) throw r.error; session=r.data.session; }
    ME=session.user.id;
    const {data:p}=await sb.from('players').select('name').eq('id',ME).maybeSingle();
    STORE.name=(p&&p.name)||''; saveStore();
    const t=await rpc('server_now'); SKEW=new Date(t).getTime()-Date.now();
  }catch(e){ return showNetError(e); }
  await fetchOpenRooms();
  const lcode=new URLSearchParams(location.search).get('l');
  const code=new URLSearchParams(location.search).get('t');
  if(code||lcode){ history.replaceState(null,'',location.pathname); }
  if(MYROOM && !code && !lcode) return enterRoom(MYROOM.id);
  await showHome();
  if(!STORE.name){ if(code) PENDING_CODE=code; if(lcode) PENDING_LEAGUE=lcode; openNameSheet(); }
  else if(code) joinByCode(code);
  else if(lcode) joinLeagueCode(lcode);
}

  stopTick(); stopLobby(); G=null; setNav(true,navKey);

}

    <h2 class="sec" style="font-size:24px">Le parole del gioco</h2>

function showHistory(){

  if(!h.length){
    pageShell('Le mie rose',`<div class="empty-state">${IC.league}<h2>Ancora nessuna rosa</h2><p class="dim">Quando finisci un\u2019asta, la tua rosa resta qui con i prezzi pagati.</p><button class="btn wide" id="go" style="margin-top:16px">Siediti a un tavolo</button></div>`,'rose');

      ${x.lineup&&x.room?`<button class="btn wide ghost" data-lu="${x.room}" style="margin:10px 0">Formazione</button>`:''}

function showRanking(){
  pageShell('Classifica',`<div class="empty-state">${IC.cup}<h2>La classifica parte con i voti</h2><p class="dim">Dopo ogni giornata le rose prendono i voti dei calciatori e si sfidano. Questa parte la colleghiamo appena abbiamo una fonte dei voti.</p><button class="btn wide ghost" id="go" style="margin-top:16px">Torna alle aste</button></div>`,'rank');
  document.getElementById('go').onclick=showAste;

function showProfile(){

  const players=h.reduce((a,x)=>a+x.roster.length,0);

    <div class="prof-h"><div class="bigav">${(STORE.name||'T')[0].toUpperCase()}</div>

  document.getElementById('chn').onclick=openNameSheet;
  const c=document.getElementById('clr'); if(c) c.onclick=()=>{ STORE.history=[]; saveStore(); toast('Storico cancellato'); showProfile(); };

boot();
