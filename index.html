function authErr(e){
  const m=((e&&e.message)||'').toLowerCase();
  if(m.includes('invalid login')) return 'Email o password errate';
  if(m.includes('already')||m.includes('registered')) return 'Questa email è già registrata: usa "Ho già un account"';
  if(m.includes('password')&&m.includes('characters')) return 'La password deve avere almeno 8 caratteri';
  if(m.includes('rate')||m.includes('seconds')) return 'Troppi tentativi: riprova tra poco';
  return errMsg(e);
}
function openAuthSheet(mode){
  const reg=mode==='reg';
  openSheet(`<h2>${reg?'Registrati con email':'Accedi'}</h2>
    <p class="dim" style="margin:6px 0 12px">${reg?'Il tuo account di ospite diventa permanente: leghe, nome e € virtuali restano tuoi.':'Attenzione: entrando in un altro account, quello da ospite di questo telefono non si recupera.'}</p>
    <input id="au-em" class="inp" type="email" inputmode="email" autocomplete="email" placeholder="Email" style="margin-bottom:8px">
    <input id="au-pw" class="inp" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="Password (almeno 8 caratteri)">
    <button class="btn wide" id="au-go" style="margin-top:12px">${reg?'Registrati':'Accedi'}</button>
    ${reg?'':'<button class="btn wide ghost" id="au-fg" style="margin-top:8px">Password dimenticata</button>'}
    <button class="btn wide ghost" id="au-sw" style="margin-top:8px">${reg?'Ho già un account':'Non ho un account: registrati'}</button>`);
  const g=x=>document.getElementById(x), val=()=>({e:g('au-em').value.trim(),p:g('au-pw').value});
  g('au-sw').onclick=()=>openAuthSheet(reg?'in':'reg');
  if(g('au-fg')) g('au-fg').onclick=async()=>{ const {e}=val(); if(!e){ toast('Scrivi la tua email'); return; }
    try{ const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}); if(error) throw error; closeSheet(); toast('Ti ho scritto: segui il link nella email'); }catch(x){ toast(authErr(x)); } };
  g('au-go').onclick=async()=>{
    const {e,p}=val();
    if(!/^\S+@\S+\.\S+$/.test(e)){ toast('Email non valida'); return; }
    if(p.length<8){ toast('La password deve avere almeno 8 caratteri'); return; }
    g('au-go').disabled=true;
    try{
      if(reg){
        const {data,error}=await sb.auth.updateUser({email:e,password:p});
        if(error) throw error;
        const {data:{session}}=await sb.auth.getSession();
        AUTH.anon=!!(session&&session.user.is_anonymous); AUTH.email=(session&&session.user.email)||'';
        closeSheet();
        if(AUTH.anon) toast('Ti ho scritto: conferma la email per completare'); else toast('Account salvato');
        if(document.querySelector('.prof-h')) showProfile(); else showHome();
      } else {
        const {error}=await sb.auth.signInWithPassword({email:e,password:p});
        if(error) throw error;
        STORE.leagueId=null; saveStore(); location.reload();
      }
    }catch(x){ toast(authErr(x)); g('au-go').disabled=false; }
  };
}

}

function showSetup(){

function showNetError(e){
  setNav(false);
  $app.innerHTML=`<div class="empty-state" style="margin-top:20vh"><h2>Non riesco a collegarmi</h2><p class="dim">${errMsg(e)}</p><button class="btn wide" style="margin-top:16px" onclick="location.reload()">Riprova</button></div>`;

let ALLOW_EXIT=false;
function initBackGuard(){
  try{ history.replaceState({fm:0},''); history.pushState({fm:1},''); }catch(e){ return; }
  window.addEventListener('popstate',()=>{
    if(ALLOW_EXIT) return;
    try{ history.pushState({fm:1},''); }catch(e){}
    const sh=document.getElementById('sheet');
    if(sh && !sh.hidden){
      if(sh.querySelector('#exit-ok')) closeSheet(); else closeSheet();
      return;
    }
    const b=document.getElementById('tb-back')||document.getElementById('lu-back');
    if(b){ b.click(); return; }
    openSheet(`<h2>Uscire dall\u2019applicazione?</h2><p class="dim" style="margin:6px 0 14px">Le tue leghe e le aste restano salvate: potrai rientrare quando vuoi.</p>
      <button class="btn wide" id="exit-ok">Esci</button><button class="btn wide ghost" data-close style="margin-top:8px">Resta</button>`);
    document.querySelector('#sheet .btn[data-close]').onclick=closeSheet;
    document.getElementById('exit-ok').onclick=()=>{
      ALLOW_EXIT=true; closeSheet();
      try{ history.go(-2); }catch(e){}
      setTimeout(()=>{ try{ window.close(); }catch(e){} ALLOW_EXIT=false; toast('Puoi chiudere l\u2019app'); },400);
    };
  });
}
async function boot(){
  loadStore(); initBackGuard();
  if(!window.supabase || SUPABASE_URL.indexOf('__')===0){ return showSetup(); }
  $app.innerHTML='<div class="empty-l" style="padding-top:40vh">Un attimo\u2026</div>';
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    let {data:{session}}=await sb.auth.getSession();
    if(!session){ const r=await sb.auth.signInAnonymously(); if(r.error) throw r.error; session=r.data.session; }
    ME=session.user.id; AUTH.anon=!!session.user.is_anonymous; AUTH.email=session.user.email||'';
    sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY') setTimeout(openNewPassSheet,300); });
    const {data:p}=await sb.from('players').select('name').eq('id',ME).maybeSingle();
    STORE.name=(p&&p.name)||''; saveStore();
    const t=await rpc('server_now'); SKEW=new Date(t).getTime()-Date.now();
    await fetchWallet();
  }catch(e){ return showNetError(e); }
  await fetchOpenRooms();
  const lcode=new URLSearchParams(location.search).get('l');
  const code=new URLSearchParams(location.search).get('t');
  if(code||lcode){ history.replaceState(null,'',location.pathname); }
  if(MYROOM && !code && !lcode) return enterRoom(MYROOM.id);
  await showHome();
  if(!STORE.name){ if(code) PENDING_CODE=code; if(lcode) PENDING_LEAGUE=lcode; openNameSheet(); }
  else if(code) joinByCode(code);
  else if(lcode) joinLeagueCode(lcode);
}

  document.getElementById('go').onclick=showAste;

const SUPPORT_EMAIL='giulianodp.gdp@gmail.com';
function showProfile(){
  const h=STORE.history;
  const players=h.reduce((a,x)=>a+x.roster.length,0);
  const top=h.flatMap(x=>x.roster).sort((a,b)=>b.price-a.price)[0];
  pageShell('Profilo',`
    <div class="prof-h"><div class="bigav">${(STORE.name||'T')[0].toUpperCase()}</div>
      <div><h2>${STORE.name||'Ospite'}</h2><p class="dim" style="font-size:14px">${STORE.name?'Salvato su questo dispositivo':'Scegli un nome per giocare'}</p></div></div>
    <div class="stats">
      <div class="stat"><b>${h.length}</b><span>aste completate</span></div>
      <div class="stat"><b>${players}</b><span>calciatori acquistati</span></div>
      <div class="stat"><b>${top?top.price:'-'}</b><span>${top?'prezzo pi\u00f9 alto ('+top.name+')':'prezzo pi\u00f9 alto'}</span></div>
      <div class="stat"><b>${h.length?Math.round(h.reduce((a,x)=>a+x.spent,0)/h.length):'-'}</b><span>crediti spesi in media</span></div>
    </div>
    ${accountCardHTML()}
    <button class="btn wide" id="chn">${STORE.name?'Cambia nome':'Scegli il tuo nome'}</button>
    <h2 class="sec" style="font-size:22px">Impostazioni e assistenza</h2>
    <div class="menu">${AUTH.anon?'':'<button id="pw-ch">'+IC.user+'Cambia password</button>'}<button id="pv">${IC.info}Privacy e dati</button><button id="sup">${IC.chat}Supporto</button><button id="acc-del" style="color:#ff9aa2">${IC.user}Elimina il mio account</button></div>
    ${h.length?'<button class="btn wide ghost" id="clr" style="margin-top:10px">Cancella lo storico</button>':''}`,'prof');
  document.getElementById('chn').onclick=openNameSheet;
  bindAccountCard();
  const gp=x=>document.getElementById(x);
  if(gp('pw-ch')) gp('pw-ch').onclick=()=>{
    openSheet(`<h2>Cambia password</h2><input id="np1" class="inp" type="password" minlength="8" placeholder="Nuova password (almeno 8 caratteri)" autocomplete="new-password"><button class="btn wide" id="np-ok" style="margin-top:12px">Salva</button>`);
    gp('np-ok').onclick=async()=>{ const v=gp('np1').value; if(v.length<8){ toast('Almeno 8 caratteri'); return; } try{ const {error}=await sb.auth.updateUser({password:v}); if(error) throw error; closeSheet(); toast('Password cambiata'); }catch(e){ toast(authErr(e)); } };
  };
  gp('pv').onclick=()=>{
    openSheet(`<h2>Privacy e dati</h2><div class="gloss"><b>Cosa conserviamo</b><span>Il tuo nome, l\u2019email se ti registri, le leghe e i tavoli a cui partecipi, il portafoglio di \u20ac virtuali.</span></div>
      <div class="gloss"><b>\u20ac virtuali</b><span>Non hanno valore reale: non si comprano, non si convertono e non si prelevano.</span></div>
      <div class="gloss"><b>Chi vede cosa</b><span>Gli altri giocatori vedono il tuo nome, la squadra e le tue rose. Il tuo codice amico lo condividi tu.</span></div>
      <div class="gloss"><b>I tuoi diritti</b><span>Puoi eliminare il tuo account in ogni momento dal profilo.</span></div>
      <p class="dim" style="font-size:12px;margin:10px 0">Testo di prova: prima del lancio pubblico va sostituito con l\u2019informativa privacy completa.</p><button class="btn wide" data-close>Chiudi</button>`);
    document.querySelector('#sheet .btn[data-close]').onclick=closeSheet;
  };
  gp('sup').onclick=()=>{
    openSheet(`<h2>Supporto</h2><p class="dim" style="margin:6px 0 12px">Hai un problema o un suggerimento? Scrivici: rispondiamo appena possibile.</p><a class="btn wide" style="display:block;text-align:center;text-decoration:none" href="mailto:${SUPPORT_EMAIL}?subject=FantaManiac%20supporto">Scrivi al supporto</a><button class="btn wide ghost" data-close style="margin-top:8px">Chiudi</button>`);
    document.querySelector('#sheet .btn[data-close]').onclick=closeSheet;
  };
  gp('acc-del').onclick=()=>{
    openSheet(`<h2>Eliminare l\u2019account?</h2><p class="dim" style="margin:6px 0 12px">Esci da tutte le leghe, perdi gli amici e il portafoglio. Il nome viene cancellato. Non si pu\u00f2 annullare.</p><button class="btn wide" id="ad-ok" style="background:#e5534b;color:#fff">S\u00ec, elimina tutto</button><button class="btn wide ghost" data-close style="margin-top:8px">Annulla</button>`);
    document.querySelector('#sheet .btn[data-close]').onclick=closeSheet;
    gp('ad-ok').onclick=async()=>{ try{ await rpc('close_account'); await sb.auth.signOut(); STORE.leagueId=null; STORE.name=''; STORE.history=[]; saveStore(); location.reload(); }catch(e){ toast(errMsg(e)); } };
  };
  const c=document.getElementById('clr'); if(c) c.onclick=()=>{ STORE.history=[]; saveStore(); toast('Storico cancellato'); showProfile(); };
}

boot();
</script>
</body>
</html>
